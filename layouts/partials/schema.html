{{/* AFS Schema.org — minimal safe version */}}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FinancialService",
  "@id": "{{ .Site.BaseURL }}#organization",
  "name": "Ashish Financial Services",
  "url": "{{ .Site.BaseURL }}",
  "logo": "{{ .Site.BaseURL }}images/logo.png",
  "description": "AMFI Registered Mutual Fund Distributor. Goal-based SIP, insurance, loans. 100% digital. PAN India.",
  "telephone": "+918073011715",
  "email": "finservashish@gmail.com",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Bangalore",
    "addressRegion": "Karnataka",
    "addressCountry": "IN"
  }
}
</script>

{{ if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Ashish Financial Services",
  "url": "{{ .Site.BaseURL }}",
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ .Site.BaseURL }}insights/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  }
}
</script>
{{ end }}

{{ if not .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {"@type":"ListItem","position":1,"name":"Home","item":"{{ .Site.BaseURL }}"},
    {"@type":"ListItem","position":2,"name":"{{ .Title }}","item":"{{ .Permalink }}"}
  ]
}
</script>
{{ end }}
