backend:
  name: git-gateway
  branch: main

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

site_url: https://remarkable-tarsier-cbae6c.netlify.app
display_url: https://remarkable-tarsier-cbae6c.netlify.app

collections:

  # 1. BLOG / INSIGHTS
  - name: "insights"
    label: "Insights (Blog)"
    folder: "content/insights/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Draft", name: "draft", widget: "boolean", default: true}
      - {label: "Author", name: "author", widget: "string", default: "AFS Team"}
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Mutual Funds","Insurance","Tax Planning","Goal Planning","Market Insights","Investment Basics","Budget & Policy","AFS Updates"]
      - {label: "SEO Description", name: "description", widget: "text", required: false}
      - {label: "Featured Image", name: "image", widget: "image", required: false}
      - {label: "Article Body", name: "body", widget: "markdown"}

  # 2. TESTIMONIALS
  - name: "testimonials"
    label: "Testimonials"
    files:
      - label: "Testimonials List"
        name: "testimonials"
        file: "data/testimonials.json"
        fields:
          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Quote", name: "quote", widget: "text"}
              - {label: "Active", name: "active", widget: "boolean", default: true}

  # 3. STATS
  - name: "stats"
    label: "Homepage Stats"
    files:
      - label: "Stats"
        name: "stats"
        file: "data/stats.json"
        fields:
          - {label: "Active Investors", name: "investors", widget: "string", default: "100+"}
          - {label: "AUM", name: "aum", widget: "string", default: "₹2Cr+"}
          - {label: "Years of Experience", name: "experience", widget: "string", default: "12+ Years"}
          - {label: "Compliance", name: "compliance", widget: "string", default: "100% AMFI"}
          - {label: "AMCs", name: "amcs", widget: "string", default: "30+"}

  # 4. SITE SETTINGS
  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "data/settings.json"
        fields:
          - {label: "WhatsApp Message", name: "whatsappMessage", widget: "string"}
          - {label: "WhatsApp Channel Link", name: "whatsappChannel", widget: "string"}
          - {label: "Contact Form Link", name: "contactForm", widget: "string"}
          - {label: "Client Portal URL", name: "clientPortal", widget: "string"}
          - {label: "Top Banner Active", name: "bannerActive", widget: "boolean", default: true}
          - {label: "Banner Text", name: "bannerText", widget: "string"}

  # 5. MODEL PORTFOLIOS
  - name: "portfolios"
    label: "Model Portfolios"
    files:
      - label: "Portfolios"
        name: "portfolios"
        file: "data/portfolios.json"
        fields:
          - label: "Portfolios"
            name: "portfolios"
            widget: "list"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - label: "Risk"
                name: "risk"
                widget: "select"
                options: ["Low Risk","Moderate Risk","Moderately High Risk","High Risk"]
              - {label: "Description", name: "description", widget: "text"}
              - {label: "Horizon", name: "horizon", widget: "string"}
              - {label: "Active", name: "active", widget: "boolean", default: true}

  # 6. PRESS & MEDIA
  - name: "press"
    label: "Press & Media"
    files:
      - label: "Press"
        name: "press"
        file: "data/press.json"
        fields:
          - label: "Milestones"
            name: "milestones"
            widget: "list"
            fields:
              - {label: "Year", name: "year", widget: "string"}
              - {label: "Event", name: "event", widget: "string"}
              - {label: "Details", name: "details", widget: "text", required: false}
          - label: "Announcements"
            name: "announcements"
            widget: "list"
            fields:
              - {label: "Date", name: "date", widget: "datetime"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Excerpt", name: "excerpt", widget: "text"}
              - {label: "Link", name: "link", widget: "string", required: false}
