[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.124.1"
  HUGO_ENV     = "production"
  NODE_VERSION = "20"

# Staging / branch previews
[context.branch-deploy]
  command = "hugo --minify -b $DEPLOY_PRIME_URL"

[context.deploy-preview]
  command = "hugo --minify -b $DEPLOY_PRIME_URL"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options           = "DENY"
    X-XSS-Protection          = "1; mode=block"
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://identity.netlify.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://www.google-analytics.com; frame-src https://docs.google.com; worker-src blob: https://cdnjs.cloudflare.com;"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects
[[redirects]]
  from   = "/admin"
  to     = "/admin/"
  status = 301

[[redirects]]
  from   = "/blog/*"
  to     = "/insights/:splat"
  status = 301

[[redirects]]
  from   = "/calculator*"
  to     = "/tools/"
  status = 301

# Netlify Identity — required for Decap CMS
[dev]
  command = "hugo server -D"
  port    = 1313
