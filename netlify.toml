[build]
  publish = "public"
  command = "hugo --minify"

[build.environment]
  HUGO_VERSION = "0.124.1"
  HUGO_ENV     = "production"
  NODE_VERSION = "20"

# Staging / branch previews
[context.branch-deploy]
  command = "hugo --minify -b $DEPLOY_PRIME_URL"

[context.deploy-preview]
  command = "hugo --minify -b $DEPLOY_PRIME_URL"

# Security headers — all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-XSS-Protection       = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://identity.netlify.com https://cdnjs.cloudflare.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://www.google-analytics.com https://*.netlify.com https://api.netlify.com https://unpkg.com; frame-src 'self' https://docs.google.com; worker-src blob: https://cdnjs.cloudflare.com;"

# Looser CSP for CMS admin — needs unpkg + netlify API
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://unpkg.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.netlify.com https://api.netlify.com https://unpkg.com; frame-src 'self'; worker-src blob:;"

# Cache static assets
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects
[[redirects]]
  from   = "/blog/*"
  to     = "/insights/:splat"
  status = 301

[[redirects]]
  from   = "/calculator*"
  to     = "/tools/"
  status = 301

[dev]
  command = "hugo server -D"
  port    = 1313
